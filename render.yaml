# InfoPlex — Render Blueprint
# https://render.com/docs/blueprint-spec
databases:
  - name: infoplex-db
    plan: free
    databaseName: infoplex
    user: infoplex

services:
  - type: web
    name: infoplex
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate --no-input && python manage.py seed_demo && gunicorn config.wsgi --log-file -
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: infoplex-db
          property: connectionString
